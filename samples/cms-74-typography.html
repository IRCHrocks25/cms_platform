<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMS-74 typography acceptance</title><style data-tokens>:root{--primary:#2563eb;}</style><style>:root{--font-body:'Inter',sans-serif;--font-heading:'Bebas Neue',sans-serif;--text-body:16px;--text-heading:40px;--mono:'JetBrains Mono',monospace;--tw-font-sans:Arial,sans-serif;}body{font-family:var(--font-body);font-size:var(--text-body);padding:24px;margin:0;color:#172033;background:#fff;}main{max-width:900px;margin:auto;}.hero-title,.h-title{font-family:var(--font-heading);font-size:var(--text-heading);}.section-heading{font-family:var(--font-heading);font-size:32px;}.statement{font-family:var(--font-body);font-size:2rem;}.tag{font-family:var(--mono);font-size:14px;}.btn{font-family:var(--font-body);color:var(--primary);}.framework{font-family:var(--tw-font-sans);}section{padding:20px 0;border-bottom:1px solid #ddd;}@media(max-width:600px){.mobile-title{font-family:var(--mono);font-size:4rem;}}</style></head><body><main><section data-section="hero" data-label="Titles"><h1 class="hero-title" data-edit="hero.title" data-type="text">All titles change together</h1><div class="h-title" data-edit="hero.second" data-type="text">A second class-based title</div><p data-edit="hero.copy" data-type="text">Body copy keeps its own font and size.</p><a class="btn" data-edit="hero.link" data-type="link" href="#details">A body-font link</a></section><section id="details" data-section="details" data-label="Headings and labels"><h2 class="section-heading" data-edit="details.heading" data-type="text">Heading group</h2><p class="statement" data-edit="details.statement" data-type="text">Large statement mapped as a heading</p><span class="tag">Independent mono slot</span><p class="mobile-title">Conditional mobile title</p><p class="framework">Framework font should not become a control</p></section></main></body></html>
